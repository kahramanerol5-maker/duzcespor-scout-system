    <section class="oneri-container">
        <div class="oneri-box">
            <span class="badge">SCOUTING SİSTEMİ</span>
            <h1>YENİ OYUNCU <span class="highlight">BİLDİR</span></h1>
            <p>Sisteme yeni bir yetenek eklemek için aşağıdaki formu eksiksiz doldurun.</p>

            <form id="scoutForm" class="modern-form">
                <div class="form-row">
                    <div class="input-group">
                        <label>Oyuncu Adı Soyadı</label>
                        <input type="text" placeholder="Örn: Arda Güler" required>
                    </div>
                    <div class="input-group">
                        <label>Mevcut Kulübü</label>
                        <input type="text" placeholder="Örn: Real Madrid">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Mevki</label>
                        <select>
                            <option>Seçiniz...</option>
                            <option>Kaleci</option>
                            <option>Defans</option>
                            <option>Orta Saha</option>
                            <option>Forvet</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Tahmini Piyasa Değeri</label>
                        <input type="text" placeholder="Örn: 15.000.000 €">
                    </div>
                </div>

                <div class="input-group">
                    <label>Scout Gözlem Notları</label>
                    <textarea rows="5" placeholder="Oyuncunun teknik ve fiziksel özellikleri hakkında detaylı bilgi veriniz..."></textarea>
                </div>

                <button type="submit" class="nav-btn" style="width: 100%; height: 50px; margin-top: 20px;">SİSTEME KAYDET</button>
            </form>
        </div>
        
    </section>
    <script>
    if (localStorage.getItem('tema') === 'light') {

</script>
